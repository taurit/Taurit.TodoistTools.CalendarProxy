name: Run unit tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install dependencies
        run: dotnet restore CalendarProxy.slnx
      - name: Build
        run: dotnet build CalendarProxy.slnx --configuration Debug --no-restore
      - name: Test
        run: dotnet test CalendarProxy.slnx --configuration Debug --no-build --no-restore --verbosity normal
