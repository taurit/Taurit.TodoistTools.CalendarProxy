name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: calendarproxy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: Taurit.TodoistTools.CalendarProxy.UI/package-lock.json
      - name: Build Angular application
        working-directory: Taurit.TodoistTools.CalendarProxy.UI
        run: |
          npm ci
          npm run build
      - name: Deploy website
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy Taurit.TodoistTools.CalendarProxy.UI/dist/taurit.todoist-tools.calendar-proxy.ui/browser --project-name=calendarfilter --branch=master
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
